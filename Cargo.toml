[package]
name = "trex_proc"
version = "0.1.0"
edition = "2024"

[lib]
name = "trex_proc"

[[bin]]
name = "trex_proc"

[dependencies]
rust_decimal = "1.43.0"
csv-async = { version = "1.3.1", features = ["tokio", "serde", "with_serde"] }
env_logger = "0.11.11"
eyre = "0.6.14"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
log = "0.4.35"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_futures"] }
rand = "0.10.3"

[[bench]]
name = "trex_proc_benchmark"
harness = false
